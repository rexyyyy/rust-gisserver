<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<script>
  // 预览页由 manager 托管、数据面在 map-api：引擎地址经 ?base= 注入。
  (function () {
    var b = (new URLSearchParams(location.search).get('base') || '').replace(/\/+$/, '');
    window.MAP_BASE = b || location.origin;
    var raw = window.fetch;
    window.fetch = function (u, o) {
      if (typeof u === 'string' && u.charAt(0) === '/' && u.charAt(1) !== '/') u = window.MAP_BASE + u;
      return raw.call(this, u, o);
    };
  })();
</script>
<title>rust-gisserver · PostGIS 矢量瓦片浏览</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="./vendor/proj4.js"></script>
<link href="./vendor/ol.css" rel="stylesheet"/>
<script src="./vendor/ol.min.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  /* 顶栏（左上） — 注意给右上角 Zoom 留空间 */
  #bar { position: absolute; top: 10px; left: 12px; z-index: 1000; background: rgba(255,255,255,.94);
         padding: 6px 10px; border-radius: 6px; font: 13px/1.5 sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
         display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 140px); }
  #hint { color: #b06000; }
  #codeBtn { font: 12px/1 sans-serif; padding: 4px 10px; border: 1px solid #1e6fd9; background: #fff;
             color: #1e6fd9; border-radius: 4px; cursor: pointer; }
  #codeBtn:hover { background: #1e6fd9; color: #fff; }
  #codeBtn[hidden] { display: none; }
  #codeWrap { position: absolute; inset: 0; z-index: 2000; background: rgba(0,0,0,.45);
              display: none; align-items: center; justify-content: center; }
  #codeWrap.open { display: flex; }
  #codeBox { width: min(880px, 94%); max-height: 84%; background: #1e1e1e; border-radius: 8px;
             display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  #codeHead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #2d2d2d;
              color: #ddd; font: 13px/1.4 sans-serif; }
  #codeHead .sp { margin-left: auto; }
  #codeHead button { font: 12px sans-serif; padding: 3px 10px; border-radius: 4px; border: 1px solid #555;
                     background: #3c3c3c; color: #ddd; cursor: pointer; }
  #code { margin: 0; padding: 12px; overflow: auto; color: #d4d4d4; font: 12px/1.6 Consolas, monospace; white-space: pre; }
  #info { position: absolute; bottom: 8px; right: 12px; z-index: 1000; background: rgba(0,0,0,.72);
          color: #fff; padding: 4px 10px; border-radius: 4px; font: 12px/1.6 monospace;
          pointer-events: none; white-space: nowrap; }
  /* 自定义缩放按钮（不依赖 ol.control 模块） */
  .custom-zoom {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    display: flex; flex-direction: column; gap: 0;
  }
  .custom-zoom button {
    width: 32px; height: 32px; font-size: 18px; font-weight: bold;
    border: 1px solid #999; background: #fff; color: #333; cursor: pointer;
    font-family: sans-serif; line-height: 1;
  }
  .custom-zoom button:hover { background: #f0f0f0; }
  .custom-zoom button:first-child { border-radius: 4px 4px 0 0; border-bottom: none; }
  .custom-zoom button:last-child  { border-radius: 0 0 4px 4px; }
  .custom-zoom button:active { background: #d0d0d0; }
</style>
</head>
<body>
<div id="bar">
  <span id="title">矢量瓦片浏览</span>
  <button id="codeBtn" type="button" hidden>代码</button>
  <span id="hint">加载中…</span>
</div>
<div id="map"></div>
<div class="custom-zoom">
  <button id="zoomIn"  type="button" title="放大">+</button>
  <button id="zoomOut" type="button" title="缩小">−</button>
</div>
<div id="codeWrap">
  <div id="codeBox">
    <div id="codeHead">
      <span id="codeTitle">加载该图层的代码</span>
      <span class="sp"></span>
      <button id="copyBtn" type="button">复制</button>
      <button id="closeBtn" type="button">关闭</button>
    </div>
    <pre id="code"></pre>
  </div>
</div>
<div id="info">层级: - | 分辨率: - | EPSG: - | x: - y: -</div>
<script>
(function () {
  if (!window.proj4) { document.getElementById('hint').textContent = 'proj4 未加载'; return; }
  if (!window.ol)   { document.getElementById('hint').textContent = 'OpenLayers 未加载'; return; }

  var ARCGIS_PX = 0.0254 / 96;
  var Q = new URLSearchParams(location.search);
  var BASE = window.MAP_BASE;
  var LAYER = Q.get('layer') || '';
  var GRID  = Q.get('grid')  || '';
  var KIND  = Q.get('kind')  || 'postgis';
  var hintEl = document.getElementById('hint');
  var infoEl = document.getElementById('info');
  document.getElementById('title').textContent = '矢量瓦片浏览：' + (LAYER || '(未指定 layer)')
    + (KIND ? ' · ' + KIND : '');

  function setHint(t) { hintEl.textContent = t; }
  function toEpsgCode(crs) {
    var m = /(?:EPSG[:/]|EPSG\/0\/)(\d+)\s*$/i.exec(String(crs || ''));
    if (!m) { var alt = /(\d+)\D*$/.exec(String(crs || '')); m = alt; }
    return m ? 'EPSG:' + m[1] : String(crs || '');
  }
  function epsgLabel(code) {
    var m = /^EPSG:(\d+)$/i.exec(String(code || ''));
    return m ? 'EPSG: ' + m[1] : '坐标系: ' + code;
  }
  var BUILTIN = { 'EPSG:4326': 1, 'EPSG:3857': 1 };

  if (!LAYER) { setHint('缺少 ?layer='); return; }

  // ====== 默认样式（兜底） ======
  var DEFAULT_STYLE = {
    version: 1,
    point:   { radius: 4, fill: { color: 'rgba(214,60,50,.85)' }, stroke: { color: '#ffffff', width: 1 } },
    line:    { stroke: { color: '#1e6fd9', width: 1.4 } },
    polygon: { fill: { color: 'rgba(30,111,217,.18)' }, stroke: { color: '#1e6fd9', width: 1.4 } },
    label:   null
  };

  // ====== 从 URL 参数注入样式 ======
  //   ?style=<base64(JSON)>   manager UI 的 StyleJsonEditor 预览按钮会这样传
  //   ?labelField=CN_NAME     覆盖标注字段
  function loadStyleFromUrl() {
    try {
      var b64 = Q.get('style');
      if (b64) {
        var json = JSON.parse(decodeURIComponent(escape(atob(b64))));
        if (json && typeof json === 'object') return json;
      }
    } catch (_) {}
    return null;
  }
  var STYLE_JSON = loadStyleFromUrl() || DEFAULT_STYLE;
  var LABEL_FIELD = Q.get('labelField') || (STYLE_JSON.label && STYLE_JSON.label.field) || null;

  // ====== jsonToStyle：把后端 JSON 样式转成 OpenLayers ol.style.Style ======
  function jsonToStyle(styleJson, labelField) {
    var s = styleJson || DEFAULT_STYLE;

    function makeFill(f) {
      if (!f || !f.color) return null;
      return new ol.style.Fill({ color: f.color });
    }
    function makeStroke(st) {
      if (!st || !st.color) return null;
      return new ol.style.Stroke({ color: st.color, width: st.width || 1 });
    }

    function makePointStyle(pt) {
      var cfg = pt || { radius: 4, fill: { color: 'rgba(214,60,50,.85)' }, stroke: { color: '#fff', width: 1 } };
      return new ol.style.Style({
        image: new ol.style.Circle({
          radius: cfg.radius || 4,
          fill: makeFill(cfg.fill),
          stroke: makeStroke(cfg.stroke)
        })
      });
    }

    function makeLineStyle(ln) {
      var cfg = ln || { stroke: { color: '#1e6fd9', width: 1.4 } };
      return new ol.style.Style({
        stroke: makeStroke(cfg.stroke) || new ol.style.Stroke({ color: '#1e6fd9', width: 1.4 })
      });
    }

    function makePolygonStyle(pg) {
      var cfg = pg || { fill: { color: 'rgba(30,111,217,.18)' }, stroke: { color: '#1e6fd9', width: 1.4 } };
      return new ol.style.Style({
        fill: makeFill(cfg.fill) || new ol.style.Fill({ color: 'rgba(30,111,217,.18)' }),
        stroke: makeStroke(cfg.stroke) || new ol.style.Stroke({ color: '#1e6fd9', width: 1.4 })
      });
    }

    function makeLabelStyle(labelCfg, field) {
      if (!labelCfg && !field) return null;
      if (labelCfg && labelCfg.enabled === false) return null;
      var fld = field || (labelCfg && labelCfg.field);
      if (!fld) return null;
      return function (feature) {
        var val = feature.get(fld);
        if (!val) return null;
        var cfg = labelCfg || {};
        return new ol.style.Style({
          text: new ol.style.Text({
            text: String(val),
            font: cfg.font || 'bold 13px sans-serif',
            offsetY: cfg.offsetY != null ? cfg.offsetY : -8,
            fill: makeFill(cfg.fill) || new ol.style.Fill({ color: '#000' }),
            stroke: makeStroke(cfg.stroke) || new ol.style.Stroke({ color: '#fff', width: 3 })
          })
        });
      };
    }

    var pointS = makePointStyle(s.point);
    var lineS  = makeLineStyle(s.line);
    var polyS  = makePolygonStyle(s.polygon);
    var labelFn = makeLabelStyle(s.label, labelField);

    return function (feature) {
      var geom = feature.getGeometry();
      if (!geom) return null;
      var gt = geom.getType();
      var arr = [];
      if (gt === 'Point' || gt === 'MultiPoint') arr.push(pointS);
      else if (gt === 'LineString' || gt === 'MultiLineString') arr.push(lineS);
      else arr.push(polyS);
      if (labelFn) {
        var ls = labelFn(feature);
        if (ls) arr.push(ls);
      }
      return arr.length ? arr : null;
    };
  }

  // ====== 网格分辨率 ======
  var MPU = 1;
  function nativeResolution(t) {
    var v = t.resolutions || {};
    if (typeof v.native === 'number') return v.native;
    if (typeof t.resolution === 'number') return t.resolution;
    return Number(t.scaleDenominator) * ARCGIS_PX / MPU;
  }

  var state = null, loaded = 0, features = 0;

  // 「代码」按钮 — 保持原功能
  function jsArray(a) { return '[' + a.map(function (x) { return String(x); }).join(', ') + ']'; }
  function buildSnippet() {
    if (!state || !state.resolutions) return '';
    var res = state.resolutions;
    var bbox = state.bbox || state.extent;
    var L = [];
    L.push('// rust-gisserver 矢量瓦片加载代码');
    L.push('const TILE_SERVER = ' + JSON.stringify(BASE) + ';');
    L.push('const LAYER = ' + JSON.stringify(LAYER) + ';');
    L.push('const CRS = ' + JSON.stringify(state.code) + ';');
    L.push('const GRID = ' + JSON.stringify(state.grid) + ';');
    L.push('const ORIGIN = ' + jsArray(state.origin) + ';');
    L.push('const RESOLUTIONS = ' + jsArray(res) + ';');
    L.push('const TILE_URL = TILE_SERVER + ' + JSON.stringify('/mvt/' + LAYER + '/' + state.grid + '/{z}/{x}/{y}.pbf') + ';');
    L.push('');
    if (!BUILTIN[state.code] && state.proj4) {
      L.push('proj4.defs(CRS, ' + JSON.stringify(state.proj4) + ');');
      L.push('ol.proj.proj4.register(proj4);');
      L.push('');
    }
    L.push('const tileGrid = new ol.tilegrid.TileGrid({');
    L.push('  extent: ' + jsArray(state.extent) + ',');
    L.push('  origin: ORIGIN, resolutions: RESOLUTIONS, tileSize: [256,256]');
    L.push('});');
    L.push('const source = new ol.source.VectorTile({');
    L.push('  projection: CRS, tileGrid: tileGrid,');
    L.push('  format: new ol.format.MVT(), url: TILE_URL');
    L.push('});');
    L.push('const map = new ol.Map({');
    L.push("  target: 'map', layers: [new ol.layer.VectorTile({ source })],");
    L.push('  view: new ol.View({ projection: CRS, center: [' + ((bbox[0]+bbox[2])/2) + ',' + ((bbox[1]+bbox[3])/2) + '], resolution: RESOLUTIONS[0] })');
    L.push('});');
    return L.join('\n');
  }
  var codeWrap = document.getElementById('codeWrap');
  var codeBtn  = document.getElementById('codeBtn');
  codeBtn.addEventListener('click', function () {
    document.getElementById('code').textContent = buildSnippet();
    codeWrap.classList.add('open');
  });
  document.getElementById('closeBtn').addEventListener('click', function () { codeWrap.classList.remove('open'); });
  codeWrap.addEventListener('click', function (e) { if (e.target === codeWrap) codeWrap.classList.remove('open'); });
  document.getElementById('copyBtn').addEventListener('click', function () {
    var btn = this, txt = document.getElementById('code').textContent;
    function done(ok) { btn.textContent = ok ? '已复制' : '复制失败'; setTimeout(function () { btn.textContent = '复制'; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { done(false); });
    } else { done(false); }
  });

  // ====== 主渲染 ======
  function render() {
    if (!state) return;
    var tms = state.tms, origin = state.origin, code = state.code;
    var resolutions = tms.map(nativeResolution);
    var z0 = tms[0], tileW = z0.tileWidth || 256, tileH = z0.tileHeight || 256;
    var zLast = tms[tms.length - 1], lastRes = resolutions[resolutions.length - 1];
    var W = zLast.matrixWidth * tileW * lastRes, H = zLast.matrixHeight * tileH * lastRes;
    var extent = [origin[0], origin[1] - H, origin[0] + W, origin[1]];
    var fitExtent = state.bbox || extent;

    var grid = new ol.tilegrid.TileGrid({
      extent: extent, origin: origin, resolutions: resolutions, tileSize: [tileW, tileH]
    });
    var matrixBounds = {};
    tms.forEach(function (t) { matrixBounds[String(t.id)] = { w: t.matrixWidth, h: t.matrixHeight }; });
    var tileBase = BASE + '/mvt/' + encodeURIComponent(LAYER) + '/' + encodeURIComponent(state.grid);

    state.resolutions = resolutions;
    state.extent = extent;
    state.tileW = tileW;
    state.tileH = tileH;
    state.tileBase = tileBase;
    codeBtn.hidden = false;

    var src = new ol.source.VectorTile({
      projection: code,
      tileGrid: grid,
      format: new ol.format.MVT(),
      tileUrlFunction: function (tileCoord) {
        var z = String(tileCoord[0]), b = matrixBounds[z];
        if (!b) return undefined;
        var col = tileCoord[1], row = tileCoord[2];
        if (col < 0 || col >= b.w || row < 0 || row >= b.h) return undefined;
        return tileBase + '/' + z + '/' + col + '/' + row + '.pbf';
      }
    });

    // ★★★ 用 jsonToStyle 生成的 styleFunction —— 应用自定义样式 ★★★
    var styleFn = jsonToStyle(STYLE_JSON, LABEL_FIELD);
    var layer = new ol.layer.VectorTile({
      source: src,
      style: styleFn
    });

    // 不传 controls —— 避免依赖缺失的 ol.control.defaults / Zoom
    // 我们用自绘的 .custom-zoom 按钮绑定 view.setResolution 实现缩放
    var map = new ol.Map({
      target: 'map',
      layers: [layer],
      view: new ol.View({
        projection: code,
        center: [(fitExtent[0] + fitExtent[2]) / 2, (fitExtent[1] + fitExtent[3]) / 2],
        resolution: resolutions[0], maxResolution: resolutions[0], constrainResolution: true
      })
    });

    // ★ 绑定自定义缩放按钮（不依赖 ol.control 模块）
    document.getElementById('zoomIn').addEventListener('click', function () {
      var v = map.getView(), r = v.getResolution();
      v.animate({ resolution: r / 1.5, duration: 120 });
    });
    document.getElementById('zoomOut').addEventListener('click', function () {
      var v = map.getView(), r = v.getResolution();
      v.animate({ resolution: r * 1.5, duration: 120 });
    });

    var fitted = false;
    function fitToData() {
      map.updateSize();
      var s = map.getSize();
      if (!s || !s[0] || !s[1]) return false;
      if (!fitted) {
        map.getView().fit(fitExtent, { padding: [20, 20, 20, 20] });
        fitted = true;
        var v = map.getView();
        updateInfo(v.getResolution(), v.getCenter()[0], v.getCenter()[1]);
      }
      return true;
    }
    if (!fitToData()) {
      requestAnimationFrame(function () {
        if (!fitToData()) {
          var ro = new ResizeObserver(function () { if (fitToData()) ro.disconnect(); });
          ro.observe(document.getElementById('map'));
        }
      });
    }

    setHint(code + ' · ' + tms.length + ' 级 · 加载中…');
    function bump() {
      var styleTag = (STYLE_JSON !== DEFAULT_STYLE) ? '（自定义样式 ✓）' : '';
      setHint('已加载瓦片 ' + loaded + ' 张 · 要素 ' + features + ' 个（' + code + '）' + styleTag);
    }
    src.on('tileloadend', function (e) {
      loaded++;
      try { var fc = src.getFeatures(e.tile.getTileCoord()); features += fc ? fc.length : 0; } catch (_) {}
      bump();
    });
    src.on('tileloaderror', function () { loaded++; bump(); });

    function fmtRes(r) {
      if (r >= 1) return r.toFixed(3) + ' 单位/px';
      if (r >= 0.01) return r.toFixed(4) + ' 单位/px';
      return r.toExponential(2) + ' 单位/px';
    }
    function updateInfo(resolution, x, y) {
      var z = grid.getZForResolution(resolution), maxZ = resolutions.length - 1;
      var lvl = (z >= 0 && z < tms.length) ? (z > maxZ ? tms[maxZ].id + '+' : tms[z].id) : '?';
      if (resolution < resolutions[maxZ] && lvl !== '?') lvl = tms[maxZ].id + '+';
      var parts = '层级: ' + lvl + ' | 分辨率: ' + fmtRes(resolution) + ' | ' + epsgLabel(code);
      if (x != null && y != null) parts += ' | x: ' + x.toFixed(4) + ' y: ' + y.toFixed(4);
      infoEl.textContent = parts;
    }
    map.on('pointermove', function (e) { var v = map.getView(); updateInfo(v.getResolution(), e.coordinate[0], e.coordinate[1]); });
    map.on('moveend', function () { var v = map.getView(); updateInfo(v.getResolution(), v.getCenter()[0], v.getCenter()[1]); });
    updateInfo(map.getView().getResolution(), map.getView().getCenter()[0], map.getView().getCenter()[1]);

    window.__mvt = { map: map, src: src, grid: grid, code: code, resolutions: resolutions,
                     state: state, styleJson: STYLE_JSON };
  }

  // ====== 网格查询 ======
  function normalizeGridId(id) {
    var s = String(id || '');
    return (/^(3857|EPSG:3857)$/i.test(s)) ? 'WebMercatorQuad' : s;
  }
  function toGridBbox(b, code) {
    if (!b) return null;
    if (code === 'EPSG:4326' || code === 'EPSG:4490') return b;
    if (Math.abs(b[0]) > 180 || Math.abs(b[2]) > 180) return b;
    try {
      var a = proj4('EPSG:4326', code, [b[0], b[1]]);
      var c = proj4('EPSG:4326', code, [b[2], b[3]]);
      return [Math.min(a[0], c[0]), Math.min(a[1], c[1]), Math.max(a[0], c[0]), Math.max(a[1], c[1])];
    } catch (e) { return b; }
  }

  var tilejsonP = fetch(BASE + '/mvt/' + encodeURIComponent(LAYER) + '/tilejson.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; });
  var gridP = GRID
    ? Promise.resolve(GRID)
    : tilejsonP.then(function (j) { return (j && j.grid) || 'WebMercatorQuad'; });

  Promise.all([tilejsonP, gridP])
    .then(function (res) {
      var tj = res[0], gid = normalizeGridId(res[1]);
      return fetch(BASE + '/ogc/tiles/v1/tileMatrixSets/' + encodeURIComponent(gid), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject('HTTP ' + r.status); })
        .then(function (j) {
          var code = toEpsgCode(j.crs);
          MPU = (typeof j.metersPerUnit === 'number' && j.metersPerUnit > 0)
              ? j.metersPerUnit
              : (/4490|4326|CRS84/i.test(String(j.crs)) ? 111319.4907932736 : 1);
          if (!BUILTIN[code]) {
            var p4 = j.proj4;
            if (!p4) { setHint('服务端未下发 ' + code + ' 的 proj4 定义，无法建图'); return; }
            proj4.defs(code, p4);
            ol.proj.proj4.register(proj4);
          }
          var tms = (j.tileMatrices || []).slice().sort(function (a, b) { return (+a.id) - (+b.id); });
          if (!tms.length) { setHint('网格无 tileMatrix 定义'); return; }
          var prev = state || {};
          var tjBounds = (tj && Array.isArray(tj.bounds) && tj.bounds.length === 4) ? tj.bounds.map(Number) : null;
          var tmsBounds = (Array.isArray(j.bbox) && j.bbox.length === 4) ? j.bbox.map(Number) : null;
          state = {
            grid: gid,
            code: code, tms: tms, origin: tms[0].topLeftCorner,
            crs: j.crs, proj4: j.proj4 || '',
            bbox: tjBounds ? toGridBbox(tjBounds, code) : tmsBounds,
            labelField: LABEL_FIELD || (tj && tj.labelField) || prev.labelField || null
          };
          render();
        });
    })
    .catch(function (e) { setHint('读取网格定义失败：' + e); });
})();
</script>
</body>
</html>
