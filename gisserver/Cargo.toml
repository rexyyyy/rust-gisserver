# gisserver —— rust-gisserver 的核心库（唯一 crates.io 包名）
# 其余功能域全部作为本包模块（src/<module>），由 features 门控；
# 地图服务器 mapserver 经 path 依赖并以 features = ["full"] 全量启用。
[package]
name = "gisserver"
description = "Core library family of rust-gisserver: bespoke COG/BigTIFF reader, tile rendering, MVT encoding, PMTiles/MBTiles archives, WMS/WFS/OGC API protocols, projections and PostGIS source - pure Rust, no GDAL binding."
version = "0.8.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rexyyyy/rust-gisserver"
readme = "README.md"

[features]
default = ["encoding", "mvt", "projection", "vector-query"]
# Windows ANSI code page fallback for gisserver::encoding::Region::from_env.
# Off by default: core stays zero-FFI / zero-unsafe; region is declared via
# GIS_ENCODING_REGION in .env (see config/env presets).
win-acp = []
encoding = ["dep:encoding_rs"]
projection = []
mvt = []
vector-query = []
# pg_source/pool.rs logs version results unconditionally, so tracing must be
# enabled whenever `postgis` is on (not only via the `storage` feature).
postgis = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:bytes", "dep:semver", "dep:tracing"]
storage = ["dep:foyer", "dep:ureq", "dep:rayon", "dep:hmac", "dep:sha2", "dep:tracing"]
cog = ["storage", "dep:flate2", "dep:weezl", "dep:zstd"]
renderer = ["cog", "projection", "storage", "dep:png"]
pmtiles = ["storage", "dep:flate2"]
arcgis-cache = ["dep:flate2"]
wms-protocol = []
wfs-protocol = ["wms-protocol", "vector-query", "dep:axum"]
ogcapi-features = ["vector-query", "dep:axum"]
ogcapi-tiles = []
full = [
    "encoding", "projection", "mvt", "vector-query", "postgis", "storage",
    "cog", "renderer", "pmtiles", "arcgis-cache", "wms-protocol",
    "wfs-protocol", "ogcapi-features", "ogcapi-tiles",
]

[dependencies]
# --- wms_common (always on): shared base types ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# --- encoding ---
encoding_rs = { version = "0.8", optional = true }

# --- postgis (pg_source) ---
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
bytes = { version = "1", optional = true }
semver = { version = "1", optional = true }

# --- storage (also used by cog / renderer / pmtiles) ---
foyer = { version = "0.22", features = ["serde"], optional = true }
ureq = { version = "2", optional = true }
rayon = { version = "1", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
tracing = { version = "0.1", optional = true }

# --- cog / pmtiles / arcgis_cache codecs ---
flate2 = { version = "1", optional = true }   # DEFLATE/zlib + gzip (PMTiles dirs, TPK)
weezl = { version = "0.1", optional = true }  # LZW (TIFF variant)
zstd = { version = "0.13", optional = true }  # ZSTD (TIFF compression 50000)

# --- renderer ---
png = { version = "0.17", optional = true }

# --- wfs-protocol / ogcapi-features (http response types) ---
axum = { version = "0.8.9", features = ["macros"], optional = true }

# --- libc — only needed on *nix for proj.rs dlopen/dlsym; Windows uses
#     extern "system" direct declarations so no crate is required. ---
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
