[package]
name = "gisserver-arcgis-cache"
# PUBLISHED name carries the gisserver- prefix; the Rust import name is unchanged.
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ArcGIS Server tile cache reader: Conf.xml/conf.cdi parsing, LOD -> custom grid derivation, compact cache v1/v2 bundle read-through."

[dependencies]
wms-common = { workspace = true }
serde = { workspace = true }
# TPK 是 ZIP 封装的缓存包；解压只需 DEFLATE（store/deflate 两法），沿用工作区
# 既有 flate2，不引入重型 zip crate（与 COG/TIFF 容器自解析的既定风格一致）。
flate2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
