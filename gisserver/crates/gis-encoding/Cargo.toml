[package]
name = "gisserver-encoding"
# PUBLISHED name carries the gisserver- prefix; the Rust import name is unchanged.
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GIS 能力底座 · 路径编码检测与归一化（GBK/UTF-8），供 GDAL 读取前预处理"

[dependencies]
encoding_rs = "0.8"

# 默认关闭：core 零 FFI / 零 unsafe。开启后 `from_env` 在 Windows 上以系统
# ANSI 代码页 GetACP() 作为兜底（保留旧 Windows 兼容行为，可选启用）。
# 区域首选由 `.env` 的 `GIS_ENCODING_REGION` 显式声明（见 config/env/README.md）。
[features]
win-acp = []
