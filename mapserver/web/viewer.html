<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>r-mapserver viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!--
  OpenLayers 由公开 CDN 引入（首次打开需联网）；瓦片/出图全部来自本服务。
  版本锁定 + 多个知名 CDN 依次回退：jsDelivr → unpkg → 国内 npmmirror
  （三者都是同一 npm 包 ol@9.2.4 的原始文件）。ol.css 与 ol.js 从同一个源注入，
  避免样式与库版本错配（控件错位 / 比例尺不可见）。
-->
<script>
  (function () {
    var V = '9.2.4';
    var SOURCES = [
      'https://cdn.jsdelivr.net/npm/ol@v' + V + '/',
      'https://unpkg.com/ol@' + V + '/',
      'https://registry.npmmirror.com/ol/' + V + '/files/'
    ];
    // 页面初始化函数由下方脚本赋值；先到达的源加载完就启动
    window.__startOl = null;
    function load(i) {
      if (i >= SOURCES.length) {
        var h = document.getElementById('hint');
        if (h) h.textContent = 'OpenLayers 未能从任何 CDN 加载：需联网访问 '
          + 'cdn.jsdelivr.net / unpkg.com / registry.npmmirror.com，'
          + '内网环境请把 ol@' + V + ' 的 dist/ol.js 与 ol.css 放到本服务静态目录。';
        return;
      }
      var base = SOURCES[i];
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = base + 'ol.css';
      document.head.appendChild(link);
      var sc = document.createElement('script');
      sc.src = base + 'dist/ol.js';
      sc.onload = function () { if (window.__startOl) window.__startOl(); };
      // 回退时一并移除失败源的 <link>，不留死样式声明
      sc.onerror = function () { link.remove(); load(i + 1); };
      document.head.appendChild(sc);
    }
    load(0);
  })();
</script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  #bar { position: absolute; top: 10px; left: 50px; z-index: 1000; background: rgba(255,255,255,.92);
         padding: 6px 10px; border-radius: 6px; font: 13px/1.5 sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
         display: flex; align-items: center; gap: 6px; max-width: calc(100% - 70px); }
  #bar select { padding: 2px 4px; max-width: 320px; }
  #bar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
               user-select: none; white-space: nowrap; }
  #hint { color: #b06000; }
  /* 代码按钮靠右尾部 */
  #bar .spacer { flex: 1 1 auto; }
  #codeBtn { padding: 3px 10px; border: 1px solid #2f6fd0; border-radius: 4px; background: #2f6fd0;
             color: #fff; font: 12px/1.4 sans-serif; cursor: pointer; white-space: nowrap; }
  #codeBtn:hover { background: #24589f; }
  /* 代码面板：右侧抽屉，等宽字体，长行横向滚动 */
  #codePanel { position: absolute; top: 0; right: 0; bottom: 0; width: min(680px, 94vw); z-index: 2000;
               background: #fff; box-shadow: -2px 0 14px rgba(0,0,0,.28); display: none; flex-direction: column; }
  #codePanel.show { display: flex; }
  #codeHead { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
              border-bottom: 1px solid #e5e5e5; font: 13px/1.5 sans-serif; }
  #codeHead .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #codeHead .ops { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  #codeHead button { padding: 3px 10px; border: 1px solid #c8c8c8; border-radius: 4px;
                     background: #f7f7f7; font: 12px/1.4 sans-serif; cursor: pointer; }
  #codeHead button:hover { background: #ececec; }
  #codeBody { flex: 1 1 auto; overflow: auto; margin: 0; padding: 10px 12px; background: #fbfbfb;
              font: 12px/1.55 ui-monospace, Consolas, "Courier New", monospace; white-space: pre; tab-size: 2; }
</style>
</head>
<body>
<div id="bar">
  <span>图层：</span>
  <select id="layer"><option>加载中…</option></select>
  <label title="OSM 在线底图：需外网。内网/离线环境下每张底图瓦会挂几十秒超时，并占满 OpenLayers 每帧 16 个瓦片加载名额，把数据瓦堵在后面，故默认关。"><input type="checkbox" id="base"/>底图</label>
  <span id="hint"></span>
  <span class="spacer"></span>
  <button id="codeBtn" type="button" title="显示本页调用当前预览图层的示例代码（含 LOD / resolutions / 坐标系常量）">代码</button>
</div>
<div id="codePanel">
  <div id="codeHead">
    <span class="name" id="codeTitle">调用代码</span>
    <span class="ops">
      <button id="codeCopy" type="button">复制</button>
      <button id="codeClose" type="button">关闭</button>
    </span>
  </div>
  <pre id="codeBody"></pre>
</div>
<div id="map"></div>
<script>
// OpenLayers 由上方加载器异步引入，因此整段初始化挂到 __startOl 上，库就绪才执行。
// 函数体内保持原有缩进，避免整文件重排。
window.__startOl = function () {
if (window.__olStarted) return;   // 防止重复启动（加载器与末尾兜底同时命中）
window.__olStarted = true;
const map = new ol.Map({
  target: 'map',
  view: new ol.View({ center: ol.proj.fromLonLat([104.0, 26.0]), zoom: 6 }),
  layers: []   // 底图改由下方开关按需加入，默认不在图里
});

// OSM 在线底图开关。
// 默认关闭的原因：本服务的数据图层自己就是完整影像，而
// tile.openstreetmap.org 在离线/内网环境不可达，每张底图瓦要挂 20~85s 才
// 超时。OpenLayers 所有图层的瓦片共用一个加载队列，每帧最多 16 张在建
// （Map.handlePostRender 里的 tileQueue_.loadMoreTiles(16, 16)），底图把这 16
// 个名额占满后，COG 数据瓦只能排在后面等超时 —— 表现成“放大 COG 就慢
// 了”，实际卡的不是 COG（服务端实测同一区间 5~59ms）。
// 勾选后才把底图层加入 map（不加入就一律不发请求），选择记在 localStorage。
const baseToggle = document.getElementById('base');
let baseLayer = null;
function applyBaseLayer(on) {
  if (on && !baseLayer) {
    baseLayer = new ol.layer.Tile({ source: new ol.source.OSM() });
    map.addLayer(baseLayer);
  } else if (!on && baseLayer) {
    map.removeLayer(baseLayer);
    baseLayer = null;
  }
  try { localStorage.setItem('rmap.base', on ? '1' : '0'); } catch (_) {}
}
let baseOn = false;
try { baseOn = localStorage.getItem('rmap.base') === '1'; } catch (_) {}
baseToggle.checked = baseOn;
applyBaseLayer(baseOn);
baseToggle.addEventListener('change', () => applyBaseLayer(baseToggle.checked));

const sel = document.getElementById('layer');
const hint = document.getElementById('hint');
let dataLayer = null;
let layers = [];

const params = new URLSearchParams(location.search);
const wanted = params.get('layer');
const tilesTpl = params.get('tiles'); // XYZ 模板直载（mbtiles 等无 WMS 图层的来源）

// 图层渲染源类型：mvt（矢量瓦片，客户端渲染最快）/ xyz（栅格瓦片）/
// wms（GetMap 兜底，服务端现渲最慢）。预览卡顿的根因是此前统一走 WMS，
// 缩放/平移都让服务端现渲整片区域；改用瓦片端点后缩放自然刷新。
// kind 以「真实瓦片探活」为准——tilejson 存在不代表瓦片可用（栅格归档也会
// 给出 /mvt 的 tilejson 桩），所以必须打一张实际瓦片确认。
function lonLatToTile(lon, lat, z) {
  const n = 2 ** z;
  const x = Math.floor((lon + 180) / 360 * n);
  const latRad = lat * Math.PI / 180;
  // 标准 Web 墨卡托瓦片行号：asinh(tan(lat)) ≡ 0.5·ln((1+sin)/(1−sin))
  const y = Math.floor((1 - Math.asinh(Math.tan(latRad)) / Math.PI) / 2 * n);
  return [z, x, y];
}

// /api/config 能定性的图层直接跳过注定失败的探活：COG / 地形栅格没有 /mvt
// 通道（实测 400），geojson / postgis 优先 /mvt。归档类（mbtiles / pmtiles）
// 从类型分不出栅格还是矢量瓦片，仍按 mvt → xyz 依次试。
async function loadSourceTypes() {
  try {
    const r = await fetch('/api/config', { cache: 'no-store' });
    if (!r.ok) return {};
    const cfg = await r.json();
    const m = {};
    for (const l of (cfg.layers || [])) {
      const t = (l.source && l.source.type) || '';
      if (t === 'cog' || t === 'terrain') m[l.name] = 'raster';
      else if (t === 'vector' || t === 'postgis') m[l.name] = 'vector';
    }
    return m;
  } catch (_) { return {}; }   // 读不到就退回全量探活，不影响出图
}

// 探一张实际瓦片判定协议：200 → 'ok'；400 → 'mismatch'（类型不合，本协议不再
// 试下去）；404 → 'miss'（本层级没有这张瓦）；其余/异常 → 'err'。
// 状态码语义与引擎约定一致（tiles.rs 的 tile_error_status）。
async function tileProbe(url, wantProto) {
  try {
    const r = await fetch(url, { method: 'GET' });
    if (r.status === 200) {
      return !wantProto || (r.headers.get('Content-Type') || '').includes('protobuf') ? 'ok' : 'err';
    }
    return r.status === 400 ? 'mismatch' : r.status === 404 ? 'miss' : 'err';
  } catch (_) { return 'err'; }
}

async function probeKind(name, bbox, srcType) {
  // 取地理范围中心探活；无范围则任取昆明附近。
  const lon = bbox ? (bbox[0] + bbox[2]) / 2 : 102.7;
  const lat = bbox ? (bbox[1] + bbox[3]) / 2 : 25.0;
  const cand = srcType === 'raster' ? ['xyz'] : ['mvt', 'xyz'];
  for (const kind of cand) {
    // z 阶梯只两级：常见数据 z=12 就有瓦；归档类（样例 mbtiles 常只到 z0~z3）
    // z=12 会回 404，不往下试就会把能直读瓦片的归档误判成 wms，
    // 而归档类根本不支持 WMS GetMap（实测 400），实际上什么都出不来。
    for (const z of [12, 0]) {
      const [zz, x, y] = lonLatToTile(lon, lat, z);
      const url = kind === 'mvt' ? `/mvt/${name}/${zz}/${x}/${y}.pbf` : `/tiles/${name}/${zz}/${x}/${y}.png`;
      const st = await tileProbe(url, kind === 'mvt');
      if (st === 'ok') return kind;
      if (st !== 'miss') break;   // 400 类型不合 / 其它异常：这个协议到此为止
    }
  }
  return 'wms';
}

// 通用做法：从 WMS GetCapabilities 拉图层清单（含地理范围），无需后端新增接口
function parseLayers(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const out = [];
  const walk = (el, bbox) => {
    for (const child of el.children) {
      if (child.tagName !== 'Layer') continue;
      const pick = t => child.querySelector(':scope > ' + t);
      const name = pick('Name')?.textContent?.trim();
      const title = pick('Title')?.textContent?.trim() || name;
      const gb = pick('EX_GeographicBoundingBox');
      let own = null;
      if (gb) {
        const g = t => parseFloat(gb.querySelector(t)?.textContent || 'NaN');
        const w = g('westBoundLongitude'), e = g('eastBoundLongitude'),
              s = g('southBoundLatitude'), n = g('northBoundLatitude');
        if ([w, e, s, n].every(Number.isFinite)) own = [w, s, e, n];
      }
      if (!own) {
        // 兜底：<BoundingBox CRS="..." minx..maxy>。只取度数坐标系的条目——
        // 服务端支持三层 CRS（内置 4326/CRS:84/3857、同名 CRS 恒等直出、
        // 跨 CRS 靠 PROJ），地理系除 WGS84 外还可能是 CGCS2000(4490)、
        // 西安 80(4214)、WGS72(4258)，它们的范围同样是经纬度；而投影带
        // （3857 / 4491..=4554 高斯-克吕格 / 32648..=32660 UTM）是米值，
        // 直接当经纬度用会把地图甩到几万公里外，必须跳过。
        const bb = pick('BoundingBox');
        const bbCrs = (bb && bb.getAttribute('CRS')) || 'EPSG:4326';
        // 短名 / URN / def-URI 写法都只看尾部 EPSG 码（服务端 normalize 同理）
        const deg = /(?:CRS:84|CRS84)$/i.test(bbCrs)
          || ['4326', '4490', '4214', '4258'].includes((bbCrs.match(/(\d+)$/) || ['', ''])[1]);
        if (bb && deg) {
          const w = parseFloat(bb.getAttribute('minx')), s = parseFloat(bb.getAttribute('miny')),
                e = parseFloat(bb.getAttribute('maxx')), n = parseFloat(bb.getAttribute('maxy'));
          if ([w, s, e, n].every(Number.isFinite)) own = [w, s, e, n];
        }
      }
      const eff = own;
      if (name) out.push({ name, title, bbox: eff, kind: 'wms' });
      walk(child, eff);
    }
  };
  walk(doc.querySelector('Capability') || doc.documentElement, null);
  return out;
}

function fitTo(meta) {
  if (meta && meta.bbox) {
    const ext = ol.proj.transformExtent(meta.bbox, 'EPSG:4326', 'EPSG:3857');
    map.getView().fit(ext, { padding: [40, 40, 40, 40], maxZoom: 18 });
  }
}

function buildLayer(name, kind) {
  if (kind === 'xyz') {
    // COG 等栅格：服务端瓦片（XYZ）直出，缩放天然按瓦片矩阵刷新
    return new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: `/tiles/${name}/{z}/{x}/{y}.png`,
        // 服务端 WebMercatorQuad 只建到 z=25（wms-common/src/tile.rs），而 OL 的
        // XYZ 默认网格到 z=42，超限仍照发请求 → 深缩放整屏 404，画面退化成父瓦
        // 拉伸的纯色。声明 maxZoom 后 OL 在 z>25 自动 overzoom 复用 z25 瓦片。
        tileGrid: ol.tilegrid.createXYZ({ tileSize: 256, maxZoom: 25 }),
        crossOrigin: 'anonymous'
      })
    });
  }
  if (kind === 'mvt') {
    // PostGIS 等矢量：矢量瓦片客户端渲染，缩放/平移最流畅
    const style = new ol.style.Style({
      fill: new ol.style.Fill({ color: 'rgba(34,170,34,0.30)' }),
      stroke: new ol.style.Stroke({ color: '#1f8f1f', width: 1 })
    });
    return new ol.layer.VectorTile({
      source: new ol.source.VectorTile({
        format: new ol.format.MVT(),
        url: `/mvt/${name}/{z}/{x}/{y}.pbf`,
        // 服务端 MVT 是标准 256px WebMercatorQuad 方案；OL 默认 512 网格
        // 会让瓦片定位错一倍（特征飞出视野→空白），必须显式对齐。
        tileGrid: ol.tilegrid.createXYZ({ tileSize: 256, maxZoom: 22 }),
        crossOrigin: 'anonymous'
      }),
      style: () => style
    });
  }
  // 兜底：WMS GetMap（1.1.1 + EPSG:3857，避开 1.3.0 轴序坑）
  return new ol.layer.Tile({
    source: new ol.source.TileWMS({
      url: '/wms',
      params: { LAYERS: name, FORMAT: 'image/png', TRANSPARENT: true, VERSION: '1.1.1' },
      serverType: 'mapserver',
      crossOrigin: 'anonymous'
    })
  });
}

// ================= 「代码」面板 =================
// 点击「代码」按钮，按当前预览图层生成一段可直接粘贴运行的 OpenLayers 代码。
// LOD / resolutions / 坐标系名称不使用外部引用，而是从服务端瓦片矩阵
// （/tileMatrixSets/{id}，WMTS Capabilities 给出每图层对应矩阵集）解析后
// 以内联常量打印，因此不同图层（WebMercatorQuad / ArcGIS 原生网格）常量不同。
let codeOpen = false;
const codePanel = document.getElementById('codePanel');
const codeBody = document.getElementById('codeBody');
const codeTitle = document.getElementById('codeTitle');
const codeBtn = document.getElementById('codeBtn');

function childByLocal(el, local) {
  if (!el) return null;
  for (const c of el.children) if ((c.localName || c.tagName) === local) return c;
  return null;
}

// urn:ogc:def:crs:EPSG::3857 / EPSG:3857 / .../3857 → EPSG:3857
function normCrs(s) {
  const t = (s || '').trim();
  const m = t.match(/EPSG:?:?(\d+)/i) || t.match(/(\d+)\s*$/);
  return m ? 'EPSG:' + m[1] : t;
}

function fmtArr(a) { return '[' + a.join(', ') + ']'; }
function q(s) { return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'"; }

// 图层 → 瓦片矩阵集（来自 WMTS Capabilities；无则回落 WebMercatorQuad）
let wmtsMetaPromise = null;
function loadWmtsMeta() {
  if (!wmtsMetaPromise) {
    wmtsMetaPromise = fetch('/wmts?service=WMTS&request=GetCapabilities&version=1.0.0', { cache: 'no-store' })
      .then(r => (r.ok ? r.text() : ''))
      .then(text => {
        const out = {};
        if (!text) return out;
        const doc = new DOMParser().parseFromString(text, 'text/xml');
        for (const lyr of doc.getElementsByTagName('Layer')) {
          const idEl = childByLocal(lyr, 'Identifier');
          if (!idEl) continue;
          const name = idEl.textContent.trim();
          const link = childByLocal(lyr, 'TileMatrixSetLink');
          const gridEl = childByLocal(link, 'TileMatrixSet');
          let bbox = null;
          const bb = childByLocal(lyr, 'WGS84BoundingBox');
          const lo = childByLocal(bb, 'LowerCorner'), up = childByLocal(bb, 'UpperCorner');
          if (lo && up) {
            const a = lo.textContent.trim().split(/\s+/).map(Number);
            const b = up.textContent.trim().split(/\s+/).map(Number);
            if (a.length === 2 && b.length === 2 && [...a, ...b].every(Number.isFinite)) bbox = [a[0], a[1], b[0], b[1]];
          }
          out[name] = { grid: gridEl ? gridEl.textContent.trim() : '', bbox };
        }
        return out;
      })
      .catch(() => ({}));
  }
  return wmtsMetaPromise;
}

// 解析瓦片矩阵集。优先用 OGC API Tiles 的 JSON 端点取服务端下发的
// resolutions.native（源 LOD，CRS 单位/px）——2026-11-10 A/B 实测确认：
// 自定义网格（ArcGIS Conf.xml / 4490 / CGCS2000 高斯带）只有 native 与
// /tiles、/mvt 的 z/col/row 寻址一致；ogc28mm（×0.00028）整体偏 5.83%，
// arcgis96dpi（×0.0254/96）还可能差 1 列。WMTS XML 端点仅作老服务降级。
const OGC_PX = 0.00028;
const gridCache = {};
async function loadGrid(id) {
  const key = id || 'WebMercatorQuad';
  if (gridCache[key]) return gridCache[key];
  const g = { id: key, crs: 'EPSG:3857', origin: [-20037508.342789244, 20037508.342789244], resolutions: [] };
  // ① 首选：/ogc/tiles/v1/tileMatrixSets/{id}，逐级带三口径分辨率与 topLeftCorner
  try {
    const r = await fetch('/ogc/tiles/v1/tileMatrixSets/' + encodeURIComponent(key), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (j.crs) g.crs = normCrs(String(j.crs));
      const ms = (j.tileMatrices || []).slice().sort((a, b) => (+a.id) - (+b.id));
      for (const t of ms) {
        const res = t.resolutions || {};
        const v = typeof res.native === 'number' ? res.native
                : typeof t.resolution === 'number' ? t.resolution
                : Number.isFinite(+t.scaleDenominator) ? +t.scaleDenominator * OGC_PX : NaN;
        if (!Number.isFinite(v) || v <= 0) continue;
        g.resolutions.push(v);
        if (g.resolutions.length === 1 && Array.isArray(t.topLeftCorner) && t.topLeftCorner.length === 2
            && t.topLeftCorner.every(Number.isFinite)) {
          g.origin = t.topLeftCorner.map(Number);
        }
      }
    }
  } catch (_) {}
  // ② 降级：WMTS Capabilities 的 TileMatrixSet XML（JSON 端点不可用时的老服务）
  if (!g.resolutions.length) {
    try {
      const r = await fetch('/tileMatrixSets/' + encodeURIComponent(key), { cache: 'no-store' });
      if (r.ok) {
        const doc = new DOMParser().parseFromString(await r.text(), 'text/xml');
        const root = doc.documentElement;
        const crsEl = childByLocal(root, 'SupportedCRS');
        if (crsEl) g.crs = normCrs(crsEl.textContent);
        for (const tm of root.getElementsByTagName('TileMatrix')) {
          const sdEl = childByLocal(tm, 'ScaleDenominator');
          const sd = sdEl ? parseFloat(sdEl.textContent) : NaN;
          if (!Number.isFinite(sd)) continue;
          g.resolutions.push(Number((sd * OGC_PX).toFixed(6)));
          if (g.resolutions.length === 1) {
            const tl = childByLocal(tm, 'TopLeftCorner');
            if (tl) {
              const p = tl.textContent.trim().split(/\s+/).map(Number);
              if (p.length === 2 && p.every(Number.isFinite)) g.origin = p;
            }
          }
        }
      }
    } catch (_) {}
  }
  if (!g.resolutions.length) {
    for (let z = 0; z <= 25; z++) g.resolutions.push(Number((156543.033928 / 2 ** z).toFixed(6)));
  }
  gridCache[key] = g;
  return g;
}

// 生成当前图层的调用代码（常量内联，随图层变化）
async function buildSnippet(name) {
  const org = location.origin;

  if (tilesTpl) {
    const quad = await loadGrid('WebMercatorQuad');
    const res = quad.resolutions.slice(0, 26);
    return [
      '/* ===== XYZ 瓦片直载（模板来自 viewer?tiles=） ===== */',
      "const CRS         = 'EPSG:3857';   // 瓦片坐标系",
      'const TILE_SIZE   = 256;',
      'const MIN_ZOOM    = 0;',
      'const MAX_ZOOM    = 25;',
      'const ORIGIN      = ' + fmtArr(quad.origin) + ';',
      'const RESOLUTIONS = ' + fmtArr(res) + ';   // LOD 0–25',
      'const TILE_URL    = ' + q(new URL(tilesTpl, location.href).href) + ';',
      '',
      '/* ===== 调用代码 ===== */',
      "const map = new ol.Map({ target: 'map', view: new ol.View({ projection: CRS, center: [0, 0], zoom: 2 }) });",
      'const tileGrid = new ol.tilegrid.TileGrid({ origin: ORIGIN, resolutions: RESOLUTIONS, tileSize: TILE_SIZE });',
      'map.addLayer(new ol.layer.Tile({',
      '  source: new ol.source.XYZ({ url: TILE_URL, tileGrid, crossOrigin: \'anonymous\' })',
      '}));'
    ].join('\n');
  }

  const meta = layers.find(l => l.name === name) || { name };
  const kind = meta.kind || 'wms';
  const wm = (await loadWmtsMeta())[name] || {};
  const nativeGridId = wm.grid || 'WebMercatorQuad';
  const nativeGrid = await loadGrid(nativeGridId);
  const quad = await loadGrid('WebMercatorQuad');
  const maxZoom = kind === 'mvt' ? 22 : 25;   // 与 buildLayer 的 maxZoom 一致
  const res = quad.resolutions.slice(0, maxZoom + 1);
  const bbox = meta.bbox || wm.bbox || null;

  const lines = [
    '/* ===== 本图层常量（随图层变化，取自服务端瓦片矩阵） ===== */',
    'const LAYER_NAME   = ' + q(name) + ';',
    'const SOURCE_TYPE  = ' + q(kind) + ';   // mvt 矢量瓦片 | xyz 栅格瓦片 | wms 服务端出图',
    "const CRS          = 'EPSG:3857';   // 本页预览的瓦片坐标系",
    'const NATIVE_GRID  = ' + q(nativeGridId) + ';',
    'const NATIVE_CRS   = ' + q(nativeGrid.crs) + ';',
    'const TILE_SIZE    = 256;',
    'const MIN_ZOOM     = 0;',
    'const MAX_ZOOM     = ' + maxZoom + ';',
    'const ORIGIN       = ' + fmtArr(quad.origin) + ';',
    'const RESOLUTIONS  = ' + fmtArr(res) + ';   // LOD 0–' + maxZoom,
    'const EXTENT_WGS84 = ' + (bbox ? fmtArr(bbox.map(v => Number(v.toFixed(6)))) : 'null') + ';'
  ];

  if (kind === 'mvt') {
    lines.push(
      'const TILE_URL     = ' + q(org + '/mvt/' + name + '/{z}/{x}/{y}.pbf') + ';',
      '// TileJSON（同一份元数据）：' + org + '/mvt/' + name + '/tilejson.json',
      '',
      '/* ===== 调用代码 ===== */',
      "const map = new ol.Map({ target: 'map', view: new ol.View({ projection: CRS, center: [0, 0], zoom: 2 }) });",
      'const tileGrid = new ol.tilegrid.TileGrid({ origin: ORIGIN, resolutions: RESOLUTIONS, tileSize: TILE_SIZE });',
      'const layer = new ol.layer.VectorTile({',
      '  source: new ol.source.VectorTile({',
      '    format: new ol.format.MVT(),',
      '    url: TILE_URL,',
      '    tileGrid,',
      "    crossOrigin: 'anonymous'",
      '  }),',
      '  style: () => new ol.style.Style({',
      "    fill: new ol.style.Fill({ color: 'rgba(34,170,34,0.30)' }),",
      "    stroke: new ol.style.Stroke({ color: '#1f8f1f', width: 1 })",
      '  })',
      '});',
      'map.addLayer(layer);',
      'if (EXTENT_WGS84) map.getView().fit(ol.proj.transformExtent(EXTENT_WGS84, \'EPSG:4326\', CRS), { padding: [40, 40, 40, 40] });'
    );
  } else if (kind === 'xyz') {
    lines.push(
      'const TILE_URL     = ' + q(org + '/tiles/' + name + '/{z}/{x}/{y}.png') + ';',
      '',
      '/* ===== 调用代码 ===== */',
      "const map = new ol.Map({ target: 'map', view: new ol.View({ projection: CRS, center: [0, 0], zoom: 2 }) });",
      'const tileGrid = new ol.tilegrid.TileGrid({ origin: ORIGIN, resolutions: RESOLUTIONS, tileSize: TILE_SIZE });',
      'map.addLayer(new ol.layer.Tile({',
      "  source: new ol.source.XYZ({ url: TILE_URL, tileGrid, crossOrigin: 'anonymous' })",
      '}));',
      'if (EXTENT_WGS84) map.getView().fit(ol.proj.transformExtent(EXTENT_WGS84, \'EPSG:4326\', CRS), { padding: [40, 40, 40, 40] });'
    );
  } else {
    lines.push(
      'const WMS_URL      = ' + q(org + '/wms') + ';',
      '',
      '/* ===== 调用代码 ===== */',
      "const map = new ol.Map({ target: 'map', view: new ol.View({ projection: CRS, center: [0, 0], zoom: 2 }) });",
      'map.addLayer(new ol.layer.Tile({',
      '  source: new ol.source.TileWMS({',
      '    url: WMS_URL,',
      "    params: { LAYERS: LAYER_NAME, FORMAT: 'image/png', TRANSPARENT: true, VERSION: '1.1.1' },",
      "    serverType: 'mapserver',",
      "    crossOrigin: 'anonymous'",
      '  })',
      '}));',
      'if (EXTENT_WGS84) map.getView().fit(ol.proj.transformExtent(EXTENT_WGS84, \'EPSG:4326\', CRS), { padding: [40, 40, 40, 40] });'
    );
  }
  return lines.join('\n');
}

async function renderCode() {
  if (!codeOpen) return;
  const name = tilesTpl ? '' : sel.value;
  codeTitle.textContent = tilesTpl ? 'XYZ 瓦片直载 · 调用代码' : ('调用代码：' + (name || '（未选择）'));
  if (!tilesTpl && !name) { codeBody.textContent = '请先选择图层'; return; }
  codeBody.textContent = '生成中…';
  try {
    codeBody.textContent = await buildSnippet(name);
  } catch (e) {
    codeBody.textContent = '生成失败：' + e;
  }
}

codeBtn.addEventListener('click', async () => {
  codeOpen = true;
  codePanel.classList.add('show');
  await renderCode();
});
document.getElementById('codeClose').addEventListener('click', () => {
  codeOpen = false;
  codePanel.classList.remove('show');
});
document.getElementById('codeCopy').addEventListener('click', async ev => {
  const btn = ev.currentTarget;
  try {
    await navigator.clipboard.writeText(codeBody.textContent);
    btn.textContent = '已复制';
  } catch (_) {
    btn.textContent = '复制失败';
  }
  setTimeout(() => { btn.textContent = '复制'; }, 1500);
});
// ================= 「代码」面板结束 =================

function switchLayer() {
  if (dataLayer) { map.removeLayer(dataLayer); dataLayer = null; }
  if (tilesTpl) {
    dataLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: tilesTpl,
        // 同上：直载 URL 也按服务端矩阵上限收口，避免 z>25 的 404 风暴
        tileGrid: ol.tilegrid.createXYZ({ tileSize: 256, maxZoom: 25 }),
        crossOrigin: 'anonymous'
      })
    });
    map.addLayer(dataLayer);
    hint.textContent = 'XYZ 瓦片直载';
    if (codeOpen) renderCode();
    return;
  }
  const name = sel.value;
  if (!name) return;
  const meta = layers.find(l => l.name === name);
  dataLayer = buildLayer(name, meta ? meta.kind : 'wms');
  map.addLayer(dataLayer);
  const label = { mvt: '矢量瓦片(MVT)', xyz: '栅格瓦片(XYZ)', wms: 'WMS 出图' }[meta ? meta.kind : 'wms'] || 'WMS 出图';
  hint.textContent = '源类型：' + label;
  fitTo(meta);
  if (codeOpen) renderCode();
}

(async () => {
  if (tilesTpl) {
    sel.parentElement.style.display = 'none';
    switchLayer();
    return;
  }
  try {
    // no-store：服务端重启后 capabilities 会更新，不能吃浏览器缓存
    const resp = await fetch('/wms?service=WMS&version=1.3.0&request=GetCapabilities', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    layers = parseLayers(await resp.text());
    if (!layers.length) {
      sel.innerHTML = '<option>（无图层）</option>';
      hint.textContent = 'GetCapabilities 未列出任何图层';
      return;
    }
    sel.innerHTML = layers.map(l =>
      '<option value="' + l.name + '">' + l.title + '（' + l.name + '）</option>'
    ).join('');
    if (wanted && layers.some(l => l.name === wanted)) {
      sel.value = wanted;
      hint.textContent = '已定位图层 ' + wanted;
    }
    // 并行探活每个图层的瓦片源类型（mvt/xyz/wms），写回 meta.kind，
    // 之后切换图层即可直接走最快源，无需再逐张试错。
    const srcTypes = await loadSourceTypes();
    await Promise.all(layers.map(async l => { l.kind = await probeKind(l.name, l.bbox, srcTypes[l.name]); }));
    switchLayer();
  } catch (e) {
    sel.innerHTML = '<option>（读取失败）</option>';
    hint.textContent = '读取 GetCapabilities 失败：' + e;
  }
})();
sel.addEventListener('change', switchLayer);
};
// 加载器先于本脚本就绪时（极端情况）直接启动
if (window.ol && window.__startOl) window.__startOl();
</script>
