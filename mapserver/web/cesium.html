<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rust-gisserver · 3D Tiles 三维浏览</title>
  <!--
    Cesium 由公开 CDN 引入（首次打开需联网）；瓦片数据全部来自本服务。
    版本锁定 + 多个知名 CDN 依次回退：jsDelivr（npm 镜像）→ unpkg → 国内 npmmirror
    → Cesium 官方下载源（前三个都是同一 npm 包 cesium@1.118 的原始文件）。
    CESIUM_BASE_URL 必须与真正加载成功的那个源一致，否则 Workers / Assets（含内置
    NaturalEarthII 离线底图）会 404；widgets.css 也从同一 base 注入，保证三者同源。
  -->
  <script>
    (function () {
      var V = '1.118';
      var BASES = [
        'https://cdn.jsdelivr.net/npm/cesium@' + V + '/Build/Cesium/',
        'https://unpkg.com/cesium@' + V + '/Build/Cesium/',
        // 国内 npm 镜像：前两者不可达时走这里
        'https://registry.npmmirror.com/cesium/' + V + '/files/Build/Cesium/',
        'https://cesium.com/downloads/cesiumjs/releases/' + V + '/Build/Cesium/'
      ];
      // 页面初始化函数由下方脚本赋值；先到达的源加载完就启动
      window.__startCesium = null;
      function useBase(base) {
        window.CESIUM_BASE_URL = base;
        var link = document.createElement('link');
        // widgets.css 必需：缺失时 canvas 会停在默认 300x150 且被信息面板遮住，页面看不见地球
        link.rel = 'stylesheet';
        link.href = base + 'Widgets/widgets.css';
        document.head.appendChild(link);
        return link;
      }
      function load(i) {
        if (i >= BASES.length) {
          var s = document.getElementById('status');
          if (s) s.innerHTML = '<b style="color:#ff5b5b">Cesium 未能从任何 CDN 加载</b><br/>' +
            '需联网访问 cdn.jsdelivr.net / unpkg.com / registry.npmmirror.com / cesium.com，' +
            '内网环境请把 cesium@' + V + ' 的 Build/Cesium 目录放到本服务静态目录下并改成相对路径。';
          return;
        }
        var link = useBase(BASES[i]);
        var sc = document.createElement('script');
        sc.src = BASES[i] + 'Cesium.js';
        sc.onload = function () { if (window.__startCesium) window.__startCesium(); };
        // 回退时一并移除失败源的 <link>，不留死样式声明
        sc.onerror = function () { link.remove(); load(i + 1); };
        document.head.appendChild(sc);
      }
      load(0);
    })();
  </script>
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(20,28,38,.86); color: #e8eef6; font: 13px/1.5 "Microsoft YaHei",sans-serif;
      padding: 12px 14px; border-radius: 8px; max-width: 380px; box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }
    #panel h3 { margin: 0 0 8px; font-size: 14px; color: #7fd1ff; }
    .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #888; flex: none; }
    .ok { background: #36d27b; } .fail { background: #ff5b5b; } .run { background: #ffc34d; }
    button {
      background: #1d6fe0; color: #fff; border: 0; padding: 5px 12px; border-radius: 6px;
      cursor: pointer; font-size: 13px; margin: 6px 6px 0 0;
    }
    button:hover { background: #2a82ff; }
    .svc { margin: 6px 0 2px; color: #9fb3c8; font-size: 12px; }
  </style>
</head>
<body>
  <div id="panel">
    <h3>rust-gisserver · 3D Tiles 三维浏览</h3>
    <div id="status">正在加载 Cesium（首次打开需联网）…</div>
    <div id="services"></div>
    <div class="row" style="margin-top:8px">
      <label style="cursor:pointer">
        <input type="checkbox" id="unlit" onchange="toggleUnlit(this.checked)"/>
        无光照（unlit，直显示纹理原色，用于排查缺法线发黑）
      </label>
    </div>
  </div>
  <div id="cesiumContainer"></div>

  <script>
    // Cesium 由 <head> 里的 CDN 加载器异步引入，故全部初始化逻辑挂在 __startCesium 上
    let viewer = null;
    const tilesets = {};
    function setDot(id, state) {
      const el = document.getElementById(id);
      if (el) el.className = "dot " + (state === "ok" ? "ok" : state === "fail" ? "fail" : "run");
    }
    function fly(name) {
      const t = tilesets[name];
      if (!t) { alert("该服务尚未加载成功"); return; }
      // 优先用修正后的 root boundingVolume + root.transform 手动算 world boundingSphere，
      // 绕开 Cesium3DTileset.boundingSphere 可能残留缓存的问题。
      const doFly = () => {
        let bs = null;
        const root = t.root;
        if (root && root.boundingVolume && root.transform) {
          try {
            // root.boundingVolume 是 Cesium 解析后的实例（OBB / sphere / region）
            // 对 OBB 用 fromOrientedBoundingBox，sphere 可以直接用，region 需要先转 center
            let localBs = null;
            if (root.boundingVolume.halfAxes) {
              localBs = Cesium.BoundingSphere.fromOrientedBoundingBox(root.boundingVolume);
            } else if (root.boundingVolume.radius) {
              localBs = root.boundingVolume;
            }
            if (localBs) {
              bs = localBs.transform(root.transform, new Cesium.BoundingSphere());
            }
          } catch (e) {
            console.warn("手动算 boundingSphere 失败:", e);
          }
        }
        if (!bs) bs = t.boundingSphere;
        if (!bs || !bs.center) {
          try { viewer.zoomTo(t); } catch (e) { console.warn("zoomTo 也失败:", e); }
          return;
        }
        // flyToBoundingSphere 第一参数必须是 BoundingSphere 对象（传 bs.center 会内部读
        // .center.x 抛 TypeError）；观察距离不是合法选项，必须写进 offset 的
        // HeadingPitchRange 第三个参数（range）。半径过小时乘安全系数避免贴脸，过大截顶。
        const range = Math.min(Math.max((bs.radius || 100) * 5, 50), 50000);
        viewer.camera.flyToBoundingSphere(bs, {
          duration: 2.0,
          offset: new Cesium.HeadingPitchRange(0, -0.5, range),
        });
      };
      // 确保 mesh 渲染至少一帧再飞（某些 LOD 需要时间初始化）
      setTimeout(doFly, 100);
    }

    // 测试用：无光照模式。Cesium 1.118 的 Cesium3DTileset 没有 unlit 属性（那是更新
    // 版本才有的），customShader 也只能在 fromUrl 加载时指定、不支持热切换，
    // 故用「带 LightingModel.UNLIT 的 customShader 重建 tileset」实现。
    // 用途：排查缺 NORMAL/材质异常导致的发黑，直接看纹理原色与接边质量。
    const svcByName = {};
    let unlitOn = false;
    // 注意：Cesium 由 CDN 异步加载，顶层不能求值 new Cesium.XXX（会抛
    // ReferenceError 并中断整个脚本块），故首次勾选 lazily 创建
    let unlitShader = null;
    async function applyUnlit(on) {
      unlitOn = on;
      if (on && !unlitShader) {
        unlitShader = new Cesium.CustomShader({ lightingModel: Cesium.LightingModel.UNLIT });
      }
      for (const name of Object.keys(tilesets)) {
        const old = tilesets[name];
        const svc = svcByName[name];
        if (!svc) continue;
        viewer.scene.primitives.remove(old);
        try {
          const t = await Cesium.Cesium3DTileset.fromUrl(svc.tileset_url, {
            maximumScreenSpaceError: 4,
            customShader: on ? unlitShader : undefined,
          });
          viewer.scene.primitives.add(t);
          autoAnchor(t, name);   // 重建实例不携带旧 root.transform 修正，需重新套用
          tilesets[name] = t;
        } catch (e) {
          console.error("重建 unlit tileset 失败:", e);
        }
      }
      // remove/add 后 Cesium 会重置基元状态，恢复勾选前的可见性
      Object.values(tilesets).forEach(t => { t.show = true; });
      // 重建包围球可能晚一帧就绪，稍延迟重新定位，避免新 tileset 还没 ready 抛错
      const first = Object.keys(tilesets)[0];
      if (first) setTimeout(() => fly(first), 300);
    }
    function toggleUnlit(on) { applyUnlit(on); }

    async function loadService(svc) {
      setDot("d-" + svc.name, "run");
      svcByName[svc.name] = svc;
      try {
        const t = await Cesium.Cesium3DTileset.fromUrl(svc.tileset_url, {
          // 较小的 maximumScreenSpaceError 强制加载更细一级的瓦片（默认 16，城市 mesh 常需 ≤ 8）
          maximumScreenSpaceError: 4,
          // 遵循当前 unlit 开关（首次加载时通常为 false）
          customShader: unlitOn ? unlitShader : undefined,
        });
        viewer.scene.primitives.add(t);

        // 某些数据转换工具计算 root.transform 的 ECEF 平移时会把
        // mesh 整体抬升到地表上方几十公里。仅对这种极端离群做保守拉回。
        autoAnchor(t, svc.name);

        const bs = t.boundingSphere;
        if (bs) {
          console.log("[cesium] " + svc.name + " boundingSphere: center=(" +
            bs.center.x.toFixed(0) + "," + bs.center.y.toFixed(0) + "," + bs.center.z.toFixed(0) +
            ") radius=" + bs.radius.toFixed(1));
        }
        tilesets[svc.name] = t;
        setDot("d-" + svc.name, "ok");
        if (Object.keys(tilesets).length === 1) {
          setTimeout(() => fly(svc.name), 500);
        }
      } catch (e) {
        setDot("d-" + svc.name, "fail");
        console.error("加载 " + svc.name + " 失败:", e);
      }
    }

    /**
     * 保守的“高空悬浮”拉回修正。
     * 旧版拿 mesh 中心 ECEF z 与椭球面（height=0）比较，对昆明（椭球高 ≈1960m）这类
     * 高高程数据会系统性误判，把本来正确的位置硬往下压上千米。
     * 现改为：计算中心点的大地高程（height above ellipsoid），只有超过阈值
     * MAX_OK_HEIGHT（10km，倾斜摄影中心不可能这么高，而典型转换 bug 是几十 km）
     * 才沿椭球法线方向把超出部分拉回，不再拿 height=0 当基准。
     */
    const MAX_OK_HEIGHT = 10000; // m
    function autoAnchor(tileset, name) {
      try {
        const bs = tileset.boundingSphere;
        if (!bs || !bs.center) return;
        const carto = Cesium.Cartographic.fromCartesian(bs.center);
        if (!carto) return;
        const h = carto.height;
        if (h > MAX_OK_HEIGHT) {
          // 沿当地椭球表面外法线方向把超出阈值的部分拉回
          const n = Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(bs.center, new Cesium.Cartesian3());
          const dz = h - MAX_OK_HEIGHT;
          console.log("[cesium] " + name + " auto-anchor: 椭球高=" + h.toFixed(1) +
            "m 超过阈值 " + MAX_OK_HEIGHT + "m → 沿法线下压 " + dz.toFixed(1) + "m");
          const root = tileset.root;
          if (!root || !root.transform) return;
          // root.transform 是列主序 4x4：索引 12,13,14 = 平移 (tx,ty,tz)
          root.transform[12] -= n.x * dz;
          root.transform[13] -= n.y * dz;
          root.transform[14] -= n.z * dz;
          // 换新引用让 Cesium 下次访问 boundingSphere 时重建世界包围球
          root.transform = new Float64Array(root.transform);
        }
      } catch (e) {
        console.warn("autoAnchor 失败:", e);
      }
    }

    async function browseServices() {
      const s = document.getElementById("status");
      const box = document.getElementById("services");
      // 支持从管理端直达：/cesium?name=<服务名> 只加载并定位该服务
      const wanted = new URLSearchParams(location.search).get("name");
      try {
        const resp = await fetch("/3dtiles");
        const data = await resp.json();
        if (!data.services || data.services.length === 0) {
          s.innerHTML = "配置目录下没有可用的 3D Tiles 服务。<br/>请在 <code>config/3dtiles/</code> 放置 XML 配置后重启。";
          return;
        }
        let list = data.services;
        if (wanted) {
          const hit = list.find(x => x.name === wanted);
          if (!hit) {
            s.innerHTML = "<b style='color:#ff5b5b'>未找到可用的 3D Tiles 服务 '" + wanted +
              "'</b>（可能数据目录缺失，详见服务管理页的「体检」）。";
            return;
          }
          list = [hit];
        }
        s.innerHTML = "共 " + list.length + " 个 3D Tiles 服务，加载中…";
        box.innerHTML = list.map(svc =>
          '<div class="svc">' + svc.title + ' <code style="color:#ffd479">/' + svc.name + '</code></div>' +
          '<div class="row"><span id="d-' + svc.name + '" class="dot"></span><span>' + svc.name + '</span>' +
          '<button onclick="fly(\'' + svc.name + '\')">定位</button></div>'
        ).join("");
        await Promise.all(list.map(loadService));
        const okN = Object.keys(tilesets).length;
        s.innerHTML = okN === list.length
          ? "<b style='color:#36d27b'>全部 " + okN + " 个服务加载成功 ✓</b>"
          : "<b style='color:#ffc34d'>加载成功 " + okN + "/" + list.length + "</b>（红色项请看控制台）";
      } catch (e) {
        s.innerHTML = "<b style='color:#ff5b5b'>读取 /3dtiles 失败</b>：" + e;
      }
    }

    window.__startCesium = function () {
      if (window.__cesiumStarted) return;   // 防止重复启动（加载器与末尾兜底同时命中）
      window.__cesiumStarted = true;
      // 不依赖 Ion token：使用 Cesium 自带的 Natural Earth II 离线底图
      Cesium.Ion.defaultAccessToken = undefined;
      viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.TileMapServiceImageryProvider.fromUrl(
            Cesium.buildModuleUrl("Assets/Textures/NaturalEarthII")
          )
        ),
        baseLayerPicker: false, terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        animation: false, timeline: false, infoBox: false, geocoder: false
      });
      viewer.scene.globe.depthTestAgainstTerrain = false;
      browseServices();
    };
    // 加载器先于本脚本就绪时（极端情况）直接启动
    if (window.Cesium && window.__startCesium) window.__startCesium();
  </script>
</body>
</html>
