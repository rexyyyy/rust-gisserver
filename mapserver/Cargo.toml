# gisserver workspace
#
# Published crates live under the `gisserver-*` namespace. Directory names stay
# short (`crates/wms-common`, `services/map-api`) and the `package` aliases in
# [workspace.dependencies] keep the same short Rust import names in source.
[workspace]
resolver = "2"
members = ["services/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 服务层引擎（D1a 定稿）：AGPL-3.0-only。本 workspace 不发布到 crates.io。
license = "AGPL-3.0-only"

[workspace.dependencies]
# --- Internal crates (gisserver-* published names) --------------------------
# `package` is the crates.io name; the key stays the Rust import name.
# `version` is required by `cargo publish` to turn a path dep into a registry one.
wms-common = { package = "gisserver-wms-common", version = "0.1.0", path = "../gisserver/crates/wms-common" }
wms-protocol = { package = "gisserver-wms-protocol", version = "0.1.0", path = "../gisserver/crates/wms-protocol" }
projection = { package = "gisserver-projection", version = "0.1.0", path = "../gisserver/crates/projection" }
storage = { package = "gisserver-storage", version = "0.1.0", path = "../gisserver/crates/storage" }
cog = { package = "gisserver-cog", version = "0.1.0", path = "../gisserver/crates/cog" }
renderer = { package = "gisserver-renderer", version = "0.1.0", path = "../gisserver/crates/renderer" }
mvt = { package = "gisserver-mvt", version = "0.1.0", path = "../gisserver/crates/mvt" }
pmtiles = { package = "gisserver-pmtiles", version = "0.1.0", path = "../gisserver/crates/pmtiles" }
arcgis-cache = { package = "gisserver-arcgis-cache", version = "0.1.0", path = "../gisserver/crates/arcgis-cache" }
vector-query = { package = "gisserver-vector-query", version = "0.1.0", path = "../gisserver/crates/vector-query" }
wfs-protocol = { package = "gisserver-wfs-protocol", version = "0.1.0", path = "../gisserver/crates/wfs-protocol" }
ogcapi-features = { package = "gisserver-ogcapi-features", version = "0.1.0", path = "../gisserver/crates/ogcapi-features" }
ogcapi-tiles = { package = "gisserver-ogcapi-tiles", version = "0.1.0", path = "../gisserver/crates/ogcapi-tiles" }
pg-source = { package = "gisserver-pg-source", version = "0.1.0", path = "../gisserver/crates/pg-source" }
gis-encoding = { package = "gisserver-encoding", version = "0.1.0", path = "../gisserver/crates/gis-encoding" }

# --- Runtime / async --------------------------------------------------------
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# Sink trait for PostGIS COPY streaming; keep the full futures facade out of
# the dependency graph.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# --- HTTP stack -------------------------------------------------------------
# axum 0.8 uses `{param}` / `{*rest}`; the 0.7 `:param` form panics at route
# registration under matchit 0.8 instead of failing at compile time.
axum = { version = "0.8.9", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
# tower-http 0.6 pairs with axum 0.8 (http-body 1.x). compression-* serves
# Capabilities / OGC JSON / WFS GeoJSON; image/* and already-compressed pbf
# are skipped by NoRecompress. request-id emits and returns x-request-id.
tower-http = { version = "0.6.11", features = ["cors", "trace", "compression-gzip", "compression-br", "compression-zstd", "request-id", "timeout"] }

# --- Serialization ----------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# --- Tile payload codecs ----------------------------------------------------
# Payload codecs only; COG container, IFD parsing, tiling and windowed reads
# are implemented in this workspace.
flate2 = "1"      # DEFLATE (zlib) + gzip (PMTiles directories)
crc32fast = "1"   # PNG CRCs
weezl = "0.1"     # LZW (TIFF variant)
zstd = "0.13"     # ZSTD (TIFF compression 50000)
png = "0.17"      # PNG encode for tile / map output

# --- Remote sources & request signing ---------------------------------------
# Sync HTTP client for range reads over http(s):// COGs.
ureq = "2"
# AWS SigV4 for s3:// COG sources (MinIO / RustFS / AWS); pure Rust.
hmac = "0.12"
sha2 = "0.10"

# --- Caching & parallel decode ----------------------------------------------
# foyer is the sole cache backend: hybrid for output tiles, in-memory for the
# other process caches. "serde" enables disk serialization of serde types.
foyer = { version = "0.22", features = ["serde"] }
rayon = "1"

# --- Observability / errors / CLI / tests -----------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

# --- Data stores ------------------------------------------------------------
# MBTiles (SQLite); bundled builds libsqlite3 from source.
rusqlite = { version = "0.40", features = ["bundled"] }
# PostGIS source for dynamic vector tiles and feature queries. A pool is built
# only when a `source.type: postgis` layer is configured.
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
semver = "1"
